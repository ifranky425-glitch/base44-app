services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Triggers the @base44/vite-plugin sandbox mode: binds 0.0.0.0:5173,
      # allows all hosts, enables polling-based file watching for bind mounts.
      - MODAL_SANDBOX_ID=1
      - BASE44_PREVIEW_MODE=1
      # Public app identifier (same value already hardcoded in app.js).
      - VITE_BASE44_APP_ID=6ac2a2c658b71f654f65e2f3
      # Public Base44 backend URL — used by the SDK for appBaseUrl and by
      # the vite proxy in vite.config.js to forward /api requests.
      - VITE_BASE44_APP_BASE_URL=https://base44.app
      # Platform-managed: Vite >= 6.1 appends this to allowedHosts.
      # Harmless on Vite 5 (ignored).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  node_modules:
