services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    environment:
      - MODAL_SANDBOX_ID=1
      - BASE44_PREVIEW_MODE=1
    command: ["sh", "-ec", "CI=true npm install && exec npm run dev -- --host 0.0.0.0"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure
